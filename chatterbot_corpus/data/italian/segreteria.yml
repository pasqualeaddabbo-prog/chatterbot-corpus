conversations:
 - - Buongiorno, è la segreteria della scuola?
  - Sì, sono l’assistente virtuale della segreteria. Come posso aiutarti?
  - Vorrei avere informazioni sulle iscrizioni.
  - Certamente. Ti interessa la procedura o le date?
  - Le date, grazie.
  - Le iscrizioni aprono il 10 marzo e chiudono il 30 aprile.
  - Perfetto, grazie. Si fanno tutte online?
  - Sì, tramite il portale della scuola.
  - Serve un account per accedere?
  - Sì, puoi registrarti con email e password.
  - Va bene. Quali documenti devo preparare?
  - Carta d’identità e codice fiscale dello studente.
  - Basta questo?
  - Sì, per la prima fase dell’iscrizione.
  - Ottimo. È possibile chiedere assistenza telefonica?
  - Certo, dal lunedì al venerdì dalle 9 alle 12.
  - Grazie. Vorrei anche sapere come richiedere un certificato scolastico.
  - Puoi farlo dal portale nella sezione “Richieste”.
  - Quanto tempo serve per ottenerlo?
  - Generalmente 3 giorni lavorativi.
  - Capito. Ci sono costi?
  - Il certificato base è gratuito.
  - Bene. Posso ritirarlo di persona?
  - Sì, presso lo sportello studenti.
  - Devo prenotare?
  - No, non è necessario.
  - Perfetto. come posso contattare un docente?
  - Puoi usare la funzione “Messaggi ai docenti” nel registro elettronico.
  - Ottimo. Vengono risposte rapidamente?
  - Entro 48 ore.
  - Va bene. Vorrei sapere anche gli orari di ricevimento.
  - Sono pubblicati sul sito, sezione “Docenti”.
  - Grazie. Esiste un numero per emergenze?
  - Sì, il numero dedicato è disponibile nella pagina contatti.
  - Perfetto. Come posso richiedere una copia del piano di studi?
  - Puoi scaricarlo dal tuo profilo studente.
  - Grazie. È aggiornato automaticamente?
  - Sì, a ogni modifica.
  - Ottimo. Ho anche bisogno del calendario degli esami.
  - È consultabile nella sezione “Avvisi”.
  - Ok. Ci sono prove obbligatorie?
  - Sì, le verifiche periodiche.
  - Perfetto. Posso iscrivermi a un corso pomeridiano?
  - Certo, trovi l’elenco nell’area attività extrascolastiche.
  - Grazie. Quanti posti sono disponibili?
  - Dipende dal corso, in media 20.
  - Va bene. Come procedo con l'iscrizione?
  - Premi il pulsante “Iscriviti” accanto al corso desiderato.
  - Grazie mille per tutte le informazioni.

